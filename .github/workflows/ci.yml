name: California Housing Pipeline

on: push

jobs:
    train:
        runs-on: ubuntu-latest

        steps:
            - name: Git Checkout
              uses: actions/checkout@v4
            - name: Install Python
              uses: actions/setup-python@v5
              with:
                python-version: 3.11
            - name: Install Dependancies
              run: |
                pip install -r requirements.txt
            - name: training model
              run: |
                python train.py